name: budget_app
description: Application de gestion de budget personnel — Windows, Android et Web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État / architecture
  flutter_riverpod: ^2.5.1

  # Base de données locale (Android + Windows via FFI)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  # Embarque sqlite3.dll dans la version Windows compilée : sans lui,
  # l'application installée ne trouve pas SQLite au premier démarrage.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4

  # Cloud / synchronisation
  supabase_flutter: ^2.6.0

  # Stockage sécurisé (PIN, préférences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.5

  # Utilitaires
  intl: ^0.19.0
  uuid: ^4.5.0

  # Interface
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Import / export
  file_picker: ^8.1.2
  desktop_drop: ^0.5.0
  csv: ^6.0.0
  pdf: ^3.11.1
  excel: ^4.0.6

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  local_notifier: ^0.1.6

  # Fenêtre desktop
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
