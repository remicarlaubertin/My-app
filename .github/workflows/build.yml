name: Build Windows + Android

# Compile automatiquement les applications à chaque envoi de code.
#  - Android : budget-android.apk
#  - Windows : BudgetSetup-x.y.z.exe (installateur) + version portable .zip
#
# Les fichiers se téléchargent dans l'onglet « Actions » du dépôt,
# et sont publiés dans « Releases » quand on pousse une étiquette v1.0.0.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  # ---------------------------------------------------------------------------
  analyse:
    name: Analyse du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ---------------------------------------------------------------------------
  android:
    name: Application Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Préparation du projet
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Compilation de l'APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Renommage
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/budget-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budget-android-apk
          path: dist/budget-android.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  windows:
    name: Application Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Préparation du projet
        run: .\scripts\bootstrap.ps1
        shell: pwsh

      - name: Compilation Windows
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Version portable (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath dist\budget-windows-portable.zip -Force

      - name: Installation d'Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Création de l'installateur
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }
          & $iscc "/DAppVersion=$version" installer\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a echoue" }

      - uses: actions/upload-artifact@v4
        with:
          name: budget-windows
          path: |
            dist/BudgetSetup-*.exe
            dist/budget-windows-portable.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  release:
    name: Publication de la version
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artefacts/budget-android-apk/budget-android.apk
            artefacts/budget-windows/BudgetSetup-*.exe
            artefacts/budget-windows/budget-windows-portable.zip
          body: |
            ### Installation

            **Windows** — télécharge `BudgetSetup-x.y.z.exe`, double-clique,
            l'application s'installe avec une icône sur le Bureau et dans le
            menu Démarrer.

            **Android** — télécharge `budget-android.apk` sur le téléphone,
            ouvre-le, autorise l'installation depuis cette source.

            Les deux versions se synchronisent avec le même compte.
